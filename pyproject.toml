[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riff-radar"
version = "0.1.0"
description = "New-release radar for metal, post-hardcore, and alt-rock. Seed it with artists you love; it crawls the Deezer graph and catches drops the week they happen."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Jason Crabtree"}]

[project.scripts]
riff-radar = "riff_radar.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
